<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zero's Hideout</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Consolas, "Courier New", monospace; color: #9fe8a0; }
    body { user-select: none; -webkit-user-select: none; }
    canvas#scene { display: block; width: 100%; height: 100%; touch-action: none; }
    #boot { position: fixed; inset: 0; background: #000; padding: 7vh 6vw; box-sizing: border-box; font-size: clamp(12px, 1.7vw, 19px); line-height: 1.55; z-index: 10; transition: opacity 1s; }
    #bootlog { margin: 0; white-space: pre-wrap; font: inherit; }
    #start { display: none; margin-top: 24px; background: var(--btn, #9fe8a0); color: #000; border: 0; padding: 10px 28px; font: inherit; font-weight: bold; cursor: pointer; letter-spacing: 0.1em; }
    #start:hover, #start:focus { background: #fff; outline: none; }
    #hint { position: fixed; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 14px; color: #c8d4e8; text-shadow: 0 1px 3px #000; pointer-events: none; padding: 0 16px; }
    #back { display: none; position: fixed; top: 16px; left: 16px; background: rgba(10, 14, 22, 0.8); color: #c8d4e8; border: 1px solid #3a4560; padding: 8px 14px; font: inherit; cursor: pointer; border-radius: 4px; }
    #back:hover, #reset:hover { background: rgba(40, 52, 80, 0.9); }
    #reset { display: none; position: fixed; top: 16px; right: 16px; background: rgba(10, 14, 22, 0.8); color: #c8d4e8; border: 1px solid #3a4560; padding: 8px 14px; font: inherit; cursor: pointer; border-radius: 4px; }
    #leave { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.55); align-items: center; justify-content: center; }
    #leave .box { background: rgba(10, 14, 22, 0.95); border: 1px solid #3a4560; border-radius: 6px; padding: 26px 30px; text-align: center; color: #c8d4e8; max-width: 80vw; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); }
    #leave p { margin: 0 0 20px; font-size: 18px; }
    #leave button { background: rgba(10, 14, 22, 0.8); color: #c8d4e8; border: 1px solid #3a4560; padding: 8px 26px; margin: 0 8px; font: inherit; cursor: pointer; border-radius: 4px; }
    #leave button:hover, #leave button:focus { background: rgba(40, 52, 80, 0.9); outline: none; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <button id="back">&larr; Back</button>
  <button id="reset">Reset view (R)</button>
  <div id="hint"></div>
  <div id="leave"><div class="box"><p>Are you sure you want to leave the party?</p><button id="leaveYes">Yes</button><button id="leaveNo">No</button></div></div>
  <div id="boot">
    <pre id="bootlog"></pre>
    <button id="start">START</button>
  </div>
  <script type="module" src="main.js"></script>
  <!-- visitor counter (GoatCounter: no cookies); the dashboard is at https://jyd5154.goatcounter.com -->
  <script data-goatcounter="https://jyd5154.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
